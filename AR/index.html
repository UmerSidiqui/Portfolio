<body>
    <div id="container">

                <label>Up/Down:</label>
                <input type="range" id="ySlider" min="-100" max="100" step="0.1" value="1">
                <span id="yValue" style="color: white; font-size: 12px; min-width: 35px;">1.0</span>
            </div>
            
            <div class="slider-group">
                <label>Front/Back:</label>
                <input type="range" id="zSlider" min="-1000" max="1000" step="0.1" value="0.3">
                <span id="zValue" style="color: white; font-size: 12px; min-width: 35px;">0.3</span>
            </div>
            
            <div class="slider-group">
                <label>Rotate:</label>
                <input type="range" id="rotateSlider" min="-180" max="180" step="5" value="0">
                <span id="rotateValue" style="color: white; font-size: 12px; min-width: 35px;">0°</span>
            </div>
        </div>

        <div id="loader" class="loader" style="display: none;">
            Loading...
        </div>

        <div id="status" class="status" style="display: none;"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let video, canvas, scene, camera, renderer;
        let faceMesh, cameraObj;
        let capModel = null;
        let isTracking = false;
        
        // Adjustable parameters
        let capScale = 0.3;
        let yOffset = 1;
        let zOffset = 0.3;
        let rotateOffset = 0;

        // Initialize
        video = document.getElementById('videoElement');
        canvas = document.getElementById('canvas3d');

        const fileInput = document.getElementById('fileInput');
        const cameraBtn = document.getElementById('cameraBtn');
        const scaleSlider = document.getElementById('scaleSlider');
        const ySlider = document.getElementById('ySlider');
        const zSlider = document.getElementById('zSlider');
        const rotateSlider = document.getElementById('rotateSlider');
        const loader = document.getElementById('loader');
        const statusDiv = document.getElementById('status');

        // Setup Three.js
        function setupThreeJS() {
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(
                63, // FOV to match typical webcam
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ 
                canvas: canvas,
                alpha: true,
                antialias: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(0, 1, 1);
            scene.add(directionalLight);

            const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight2.position.set(0, -1, -1);
            scene.add(directionalLight2);
        }

        // Load GLB model
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            showLoader('Loading 3D cap model...');

            const url = URL.createObjectURL(file);
            const gltfLoader = new GLTFLoader();

            gltfLoader.load(
                url,
                (gltf) => {
                    if (capModel) {
                        scene.remove(capModel);
                    }

                    capModel = gltf.scene;
                    
                    // Center the model
                    const box = new THREE.Box3().setFromObject(capModel);
                    const center = box.getCenter(new THREE.Vector3());
                    capModel.position.sub(center);

                    scene.add(capModel);
                    
                    hideLoader();
                    showStatus('Cap loaded! Start camera to try it on.', 3000);
                    URL.revokeObjectURL(url);
                },
                (progress) => {
                    const percent = (progress.loaded / progress.total * 100).toFixed(0);
                    showLoader(`Loading model... ${percent}%`);
                },
                (error) => {
                    console.error('Error loading GLB:', error);
                    hideLoader();
                    showStatus('Error loading GLB file. Please try another file.', 5000);
                }
            );
        });

        // Camera controls
        cameraBtn.addEventListener('click', async () => {
            if (isTracking) {
                stopCamera();
            } else {
                await startCamera();
            }
        });

        async function startCamera() {
            try {
                showLoader('Starting camera...');

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });

                video.srcObject = stream;

                await new Promise((resolve) => {
                    video.onloadedmetadata = resolve;
                });

                await video.play();

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                renderer.setSize(video.videoWidth, video.videoHeight);
                camera.aspect = video.videoWidth / video.videoHeight;
                camera.updateProjectionMatrix();

                await initFaceTracking();

                cameraBtn.textContent = '⏸️ Stop Camera';
                hideLoader();

            } catch (error) {
                console.error('Camera error:', error);
                hideLoader();
                showStatus('Camera access denied. Please allow camera permissions.', 5000);
            }
        }

        function stopCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }

            if (cameraObj) {
                cameraObj.stop();
            }

            isTracking = false;
            cameraBtn.textContent = '📷 Start Camera';
        }

        async function initFaceTracking() {
            showLoader('Initializing face tracking...');

            // Load MediaPipe scripts
            await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js');
            await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js');

            faceMesh = new window.FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });

            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            faceMesh.onResults(onFaceResults);

            cameraObj = new window.Camera(video, {
                onFrame: async () => {
                    if (isTracking) {
                        await faceMesh.send({ image: video });
                    }
                },
                width: 1280,
                height: 720
            });

            await cameraObj.start();
            isTracking = true;
            hideLoader();
            showStatus('Face tracking active! Adjust sliders to fit the cap.', 3000);
        }

        function onFaceResults(results) {
            if (!capModel) {
                renderer.render(scene, camera);
                return;
            }

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                updateCapPosition(landmarks);
            }

            renderer.render(scene, camera);
        }

        function updateCapPosition(landmarks) {
            // Key facial landmarks
            const foreheadTop = landmarks[10];
            const leftTemple = landmarks[234];
            const rightTemple = landmarks[454];
            const noseTip = landmarks[1];

            // Calculate center position
            const centerX = ((leftTemple.x + rightTemple.x) / 2 - 0.5) * 2;
            const centerY = -(foreheadTop.y - 0.5) * 2 + yOffset;
            const centerZ = -2.5 + zOffset;

            // Calculate face width for scaling
            const faceWidth = Math.abs(rightTemple.x - leftTemple.x);
            const scale = faceWidth * 10 * capScale;

            // Calculate head rotation
            const rotationY = Math.atan2(
                rightTemple.x - leftTemple.x,
                rightTemple.z - leftTemple.z
            );

            const rotationZ = Math.atan2(
                rightTemple.y - leftTemple.y,
                rightTemple.x - leftTemple.x
            );

            // Apply transformations
            capModel.position.set(centerX, centerY, centerZ);
            capModel.scale.set(scale, scale, scale);
            capModel.rotation.set(0, rotationY + (rotateOffset * Math.PI / 180), -rotationZ);
        }

        // Slider controls
        scaleSlider.addEventListener('input', (e) => {
            capScale = parseFloat(e.target.value);
            document.getElementById('scaleValue').textContent = capScale.toFixed(2);
        });

        ySlider.addEventListener('input', (e) => {
            yOffset = parseFloat(e.target.value);
            document.getElementById('yValue').textContent = yOffset.toFixed(1);
        });

        zSlider.addEventListener('input', (e) => {
            zOffset = parseFloat(e.target.value);
            document.getElementById('zValue').textContent = zOffset.toFixed(1);
        });

        rotateSlider.addEventListener('input', (e) => {
            rotateOffset = parseFloat(e.target.value);
            document.getElementById('rotateValue').textContent = rotateOffset.toFixed(0) + '°';
        });

        // UI helpers
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        function showLoader(message) {
            loader.textContent = message;
            loader.style.display = 'block';
        }

        function hideLoader() {
            loader.style.display = 'none';
        }

        function showStatus(message, duration = 0) {
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';

            if (duration > 0) {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, duration);
            }
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            if (video.videoWidth && video.videoHeight) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                renderer.setSize(video.videoWidth, video.videoHeight);
                camera.aspect = video.videoWidth / video.videoHeight;
                camera.updateProjectionMatrix();
            }
        });

        // Initialize
        setupThreeJS();
        showStatus('Upload your GLB cap file to begin!', 5000);
    </script>
</body>

            const width = imageData.width;
            const height = imageData.height;
            const data = imageData.data;
            const edges = new Uint8ClampedArray(width * height);
            
            const step = 5; // Sample every 5 pixels for performance
            
            for (let y = step; y < height - step; y += step) {
                for (let x = step; x < width - step; x += step) {
                    const idx = (y * width + x) * 4;
                    
                    const gray = data[idx] * 0.299 + data[idx + 1] * 0.587 + data[idx + 2] * 0.114;
                    
                    const idx_right = (y * width + (x + step)) * 4;
                    const idx_down = ((y + step) * width + x) * 4;
                    
                    const gray_right = data[idx_right] * 0.299 + data[idx_right + 1] * 0.587 + data[idx_right + 2] * 0.114;
                    const gray_down = data[idx_down] * 0.299 + data[idx_down + 1] * 0.587 + data[idx_down + 2] * 0.114;
                    
                    const gx = Math.abs(gray_right - gray);
                    const gy = Math.abs(gray_down - gray);

        // Edge detection (simplified)
        function detectEdges(imageData) {
            const width = imageData.width;
            const height = imageData.height;
            const data = imageData.data;
            const edges = new Uint8ClampedArray(width * height);
            
            const step = 5;
            
            for (let y = step; y < height - step; y += step) {
                for (let x = step; x < width - step; x += step) {
                    const idx = (y * width + x) * 4;
                    
                    const gray = data[idx] * 0.299 + data[idx + 1] * 0.587 + data[idx + 2] * 0.114;
                    
                    const idx_right = (y * width + (x + step)) * 4;

            return points;
        }

        // Find largest rectangle
        function findLargestRectangle(points) {
            if (points.length < 100) return null;
            
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;
            
            points.forEach(p => {
                minX = Math.min(minX, p.x);
                maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y);
                maxY = Math.max(maxY, p.y);
            });
            
            const width = maxX - minX;
            const height = maxY - minY;
            const area = width * height;
            
            if (area > 50000 && width > 200 && height > 200) {
                const margin = 50;
                return {
                    corners: [
                        {x: minX + margin, y: minY + margin},
                        {x: maxX - margin, y: minY + margin},
                        {x: maxX - margin, y: maxY - margin},
                        {x: minX + margin, y: maxY - margin}
                    ],
                    area: area
                };
            }
            
            return null;
        }

        // Draw surface overlay
        function drawSurfaceOverlay() {
            if (!surfaceCorners) return;
            
            surfaceCtx.strokeStyle = '#00ff00';
            surfaceCtx.lineWidth = 3;
            surfaceCtx.beginPath();
            
            surfaceCorners.forEach((corner, i) => {
                if (i === 0) {
                    surfaceCtx.moveTo(corner.x, corner.y);
                } else {
                    surfaceCtx.lineTo(corner.x, corner.y);
                }
            });
            
            surfaceCtx.closePath();
            surfaceCtx.stroke();
            
            // Draw corners
            surfaceCtx.fillStyle = '#00ff00';
            surfaceCorners.forEach(corner => {
                surfaceCtx.beginPath();
                surfaceCtx.arc(corner.x, corner.y, 8, 0, Math.PI * 2);
                surfaceCtx.fill();
            });
        }

        // Update surface indicator
        function updateSurfaceIndicator() {
            if (surfaceDetected) {
                surfaceIndicator.textContent = '✓ Surface Detected';
                surfaceIndicator.classList.add('detected');
            } else {
                surfaceIndicator.textContent = '❌ No Surface Detected';
                surfaceIndicator.classList.remove('detected');
            }
        }

        // Place model on detected surface automatically
        function placeModelOnSurface() {
            if (!foodModel || placedModel) return;

            placedModel = foodModel.clone();
            
            const scaleValue = pizzaSizeCm / MODEL_TO_CM_RATIO;
            modelScale = scaleValue;
            
            // Center position on the surface
            placedModel.position.set(0, -1, -3);
            placedModel.scale.set(scaleValue, scaleValue, scaleValue);
            
            // Apply current rotation
            placedModel.rotation.x = modelRotation.x;
            placedModel.rotation.y = modelRotation.y;
            placedModel.rotation.z = modelRotation.z;
            
            // Enable shadows
            placedModel.traverse((node) => {
                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                }
            });

            scene.add(placedModel);
            removeBtn.style.display = 'block';
        }

        // Mouse/Touch interaction for rotation
        canvas3d.addEventListener('mousedown', (e) => {
            if (!placedModel) return;
            isDragging = true;
            previousMousePosition = {
                x: e.clientX,
                y: e.clientY
            };
        });

        canvas3d.addEventListener('mousemove', (e) => {
            if (!isDragging || !placedModel) return;
            
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;
            
            // Rotate around Y axis (horizontal drag)
            modelRotation.y += deltaX * 0.01;
            
            // Rotate around X axis (vertical drag)
            modelRotation.x += deltaY * 0.01;
            
            placedModel.rotation.y = modelRotation.y;
            placedModel.rotation.x = modelRotation.x;
            
            previousMousePosition = {
                x: e.clientX,
                y: e.clientY
            };
        });

        canvas3d.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Touch support for rotation
        let previousTouchPosition = { x: 0, y: 0 };

        canvas3d.addEventListener('touchstart', (e) => {
            if (!placedModel) return;
            e.preventDefault();
            isDragging = true;
            const touch = e.touches[0];
            previousTouchPosition = {
                x: touch.clientX,
                y: touch.clientY
            };
        });

        canvas3d.addEventListener('touchmove', (e) => {
            if (!isDragging || !placedModel) return;
            e.preventDefault();
            
            const touch = e.touches[0];
            const deltaX = touch.clientX - previousTouchPosition.x;
            const deltaY = touch.clientY - previousTouchPosition.y;
            
            // Rotate around Y axis (horizontal drag)
            modelRotation.y += deltaX * 0.01;
            
            // Rotate around X axis (vertical drag)
            modelRotation.x += deltaY * 0.01;
            
            placedModel.rotation.y = modelRotation.y;
            placedModel.rotation.x = modelRotation.x;
            
            previousTouchPosition = {
                x: touch.clientX,
                y: touch.clientY
            };
        });

        canvas3d.addEventListener('touchend', (e) => {
            e.preventDefault();
            isDragging = false;
        });

        // Pinch to rotate around Z axis (roll)
        let initialPinchDistance = 0;
        let initialRotationZ = 0;

        canvas3d.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2 && placedModel) {
                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                
                const dx = touch2.clientX - touch1.clientX;
                const dy = touch2.clientY - touch1.clientY;
                initialPinchDistance = Math.sqrt(dx * dx + dy * dy);
                initialRotationZ = Math.atan2(dy, dx);
            }
        });

        canvas3d.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && placedModel) {
                e.preventDefault();
                
                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                
                const dx = touch2.clientX - touch1.clientX;
                const dy = touch2.clientY - touch1.clientY;
                const currentRotation = Math.atan2(dy, dx);
                
                const rotationDiff = currentRotation - initialRotationZ;
                modelRotation.z = rotationDiff;
                placedModel.rotation.z = modelRotation.z;
                
                initialRotationZ = currentRotation;
            }
        });

        // Remove object button
        removeBtn.addEventListener('click', () => {
            if (placedModel) {
                scene.remove(placedModel);
                placedModel = null;
                modelRotation = { x: 0, y: 0, z: 0 };
                removeBtn.style.display = 'none';
                
                // Unlock surface
                surfaceLocked = false;
                lockedSurfaceCenter = null;
                surfaceDetected = false;
                detectBtn.disabled = false;
                detectBtn.textContent = '🔍 Detect Surface';
                updateSurfaceIndicator();
                
                showStatus('Object removed! Detect surface to place again.', 2000);
            }
        });

        // Scale slider
        scaleSlider.addEventListener('input', (e) => {
            pizzaSizeCm = parseFloat(e.target.value);
            document.getElementById('scaleValue').textContent = pizzaSizeCm + 'cm';
            
            // Update placed model scale if it exists
            if (placedModel) {
                const scaleValue = pizzaSizeCm / MODEL_TO_CM_RATIO;
                placedModel.scale.set(scaleValue, scaleValue, scaleValue);
            }
        });

        // UI helpers
        function showStatus(message, duration = 0) {
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';

            if (duration > 0) {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, duration);
            }
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            if (video.videoWidth && video.videoHeight) {
                canvas3d.width = video.videoWidth;
                canvas3d.height = video.videoHeight;
                surfaceCanvas.width = video.videoWidth;
                surfaceCanvas.height = video.videoHeight;
                renderer.setSize(video.videoWidth, video.videoHeight);
                camera.aspect = video.videoWidth / video.videoHeight;
                camera.updateProjectionMatrix();
            }
        });

        // Initialize
        setupThreeJS();
        loadModelFromPath(PIZZA_MODEL_PATH);
        showStatus('Upload a GLB model or wait for pizza to load. Then start camera!', 4000);
    </script>
</body>
</html>
